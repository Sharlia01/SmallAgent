# 通用的单数据库迁移配置。

[alembic]
# 迁移脚本目录，通常使用 POSIX 风格的正斜杠路径。
# 相对路径以 %(here)s 为基准，即当前配置文件所在目录。
script_location = %(here)s/alembic

# 生成迁移文件名的模板，默认值为 %%(rev)s_%%(slug)s。
# 如需在文件名前添加日期和时间，可启用以下配置。
# 可用占位符见：https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 若配置此路径，则添加到 sys.path 开头；默认使用当前工作目录。
# 多个路径之间使用下方 path_separator 指定的分隔符。
prepend_sys_path = .


# 迁移文件内容和文件名中日期时间所使用的时区。
# 设置后需要 Python 3.9 以上，或 backports.zoneinfo，以及 tzdata。
# 可通过安装 alembic[tz] 补齐依赖，配置字符串会传入 ZoneInfo()。
# 留空表示使用本地时区。
# timezone =

# 迁移文件名中 slug 字段的最大字符数。
# truncate_slug_length = 40

# 设置为 true 后，执行 revision 命令时始终运行迁移环境，
# 无论是否启用自动生成。
# revision_environment = false

# 设置为 true 后，允许将 versions 目录中没有对应源文件的
# .pyc 和 .pyo 文件识别为迁移版本。
# sourceless = false

# 迁移版本目录，默认使用 <script_location>/versions。
# 使用多个目录时，初始迁移需通过 --version-path 指定位置。
# 路径分隔符由下方 path_separator 配置决定。
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator 指定版本目录和 prepend_sys_path 等路径列表的分隔符。
# 新建配置默认使用 os，即按系统的 os.pathsep 分隔。
# 旧配置缺少此选项时不会自动采用该默认值，而是执行兼容逻辑：
# 1. version_locations 优先读取旧版 version_path_separator；缺少时按空格或逗号分隔。
# 2. prepend_sys_path 按空格、逗号或冒号分隔。
# 可用值包括以下几种：
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
# 新项目默认使用系统路径分隔符 os.pathsep。
path_separator = os

# 设置为 true 后，在每个版本目录中递归搜索迁移源文件。
# 该配置从 Alembic 1.10 开始支持。
# recursive_version_locations = false

# 从 script.py.mako 写出迁移文件时使用的编码。
# output_encoding = utf-8

# 数据库地址仅由项目维护的 env.py 读取。
# 也可以在 env.py 中自定义数据库地址的获取方式。
# sqlalchemy.url = postgresql://postgres:pg123456@gsk_pg:5432/gsk


[post_write_hooks]
# post_write_hooks 指定生成迁移脚本后执行的脚本或 Python 函数。
# 详细用法和示例见 Alembic 文档。

# 格式化示例：通过 console_scripts 调用 black 入口。
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# 代码检查及自动修复示例：通过 exec 执行 ruff。
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# 日志配置，仅由项目维护的 env.py 读取。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
